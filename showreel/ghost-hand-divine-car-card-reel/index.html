<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720">
    <title>Archive still slideshow</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000; }
      .still-frame { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="archive-still-slideshow" data-start="0" data-duration="10" data-fps="30" data-width="1280" data-height="720">
      <img
        id="frame-lead-portrait"
        class="still-frame"
        src="assets/stills/01-lead-portrait.webp"
        alt=""
        style="opacity:1;object-position:56% 42%;z-index:1"
      >
      <img
        id="frame-racer-monitor"
        class="still-frame"
        src="assets/stills/02-racer-monitor.webp"
        alt=""
        style="opacity:0;object-position:58% 44%;z-index:2"
      >
      <img
        id="frame-action-monitor"
        class="still-frame"
        src="assets/stills/03-action-monitor.webp"
        alt=""
        style="opacity:0;object-position:49% 44%;z-index:3"
      >
      <img
        id="frame-four-person-night"
        class="still-frame"
        src="assets/stills/04-four-person-night.webp"
        alt=""
        style="opacity:0;object-position:55% 45%;z-index:4"
      >
      <img
        id="frame-night-team"
        class="still-frame"
        src="assets/stills/05-night-team.webp"
        alt=""
        style="opacity:0;object-position:52% 49%;z-index:5"
      >
      <img
        id="frame-full-cast-crew"
        class="still-frame"
        src="assets/stills/06-full-cast-crew.webp"
        alt=""
        style="opacity:0;object-position:53% 50%;z-index:6"
      >
      <img
        id="loop-return-frame"
        class="still-frame"
        src="assets/stills/01-lead-portrait.webp"
        alt=""
        style="opacity:0;object-position:56% 42%;z-index:7"
      >
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#frame-lead-portrait", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#frame-racer-monitor", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 1.6666666666666667);
      tl.fromTo("#frame-action-monitor", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 3.3333333333333335);
      tl.fromTo("#frame-four-person-night", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 5);
      tl.fromTo("#frame-night-team", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 6.666666666666667);
      tl.fromTo("#frame-full-cast-crew", { scale: 1 }, { scale: 1.035, duration: 1.6666666666666667, ease: "none", immediateRender: false }, 8.333333333333334);
      tl.to("#frame-lead-portrait", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 1.6666666666666667);
      tl.fromTo("#frame-racer-monitor", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 1.6666666666666667);
      tl.to("#frame-racer-monitor", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 3.3333333333333335);
      tl.fromTo("#frame-action-monitor", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 3.3333333333333335);
      tl.to("#frame-action-monitor", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 5);
      tl.fromTo("#frame-four-person-night", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 5);
      tl.to("#frame-four-person-night", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 6.666666666666667);
      tl.fromTo("#frame-night-team", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 6.666666666666667);
      tl.to("#frame-night-team", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 8.333333333333334);
      tl.fromTo("#frame-full-cast-crew", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 8.333333333333334);
      tl.to("#frame-full-cast-crew", { opacity: 0, duration: 0.26666666666666666, ease: "sine.inOut" }, 9.733333333333333);
      tl.fromTo("#loop-return-frame", { opacity: 0 }, { opacity: 1, duration: 0.26666666666666666, ease: "sine.inOut", immediateRender: false }, 9.733333333333333);
      window.__timelines["archive-still-slideshow"] = tl;
    </script>
  </body>
</html>
