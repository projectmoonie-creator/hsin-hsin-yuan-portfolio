<!doctype html>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        background: #0b0b0c;
      }

        overflow: hidden;
        background: #0b0b0c;
      }

      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        background: #0b0b0c;
        filter: saturate(0.92) contrast(1.05) brightness(0.95);
      }
    </style>
  </head>
